# Production deliberately fails fast until secrets, endpoints, and TLS files
# are injected through APP_* variables or the platform secret manager.
app:
  env: production
http:
  address: 0.0.0.0:8080
log:
  level: info
  format: json
swagger:
  enabled: true
  require_auth: true
grpc:
  address: 0.0.0.0:9090
  reflection_enabled: false
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
auth:
  jwks_url: ""
  issuer: identity-service
  audience: scheduler-service
authorization:
  enabled: true
database:
  enabled: true
  name: platform
  schema: scheduler
  dsn: ""
redis:
  enabled: true
migration:
  auto_up: true
  create_schema: false
  database_url: ""
rate_limit:
  enabled: true
idempotency:
  enabled: true
observability:
  metrics_enabled: true
  tracing_enabled: false
outbound:
  grpc:
    application:
      target: application-service.platform.svc.cluster.local:9090
      tls: {enabled: true, server_name: application-service.platform.svc.cluster.local, ca_file: /etc/platform/tls/ca.crt, cert_file: /etc/platform/tls/tls.crt, key_file: /etc/platform/tls/tls.key}
    authorization:
      target: authorization-service:9090
      timeout: 2s
      retry:
        max_attempts: 1
        initial_backoff: 100ms
        max_backoff: 1s
        methods: []
      breaker:
        enabled: true
        failure_threshold: 5
        open_timeout: 30s
      tls:
        enabled: true
        server_name: authorization-service
        ca_file: ""
